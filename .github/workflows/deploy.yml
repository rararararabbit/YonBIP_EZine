name: Deploy YonBIP_EZine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        required: true
        type: choice
        options:
          - test
          - prod
        default: test

concurrency:
  group: deploy-yonbip-ezine-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build:prod

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 123.56.7.111
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/,package.json,package-lock.json"
          target: "/var/www/YonBIP_EZine"
          overwrite: true

      - name: Install production deps and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 123.56.7.111
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/YonBIP_EZine
            npm ci --omit=dev
            if pm2 describe YonBIP_EZine >/dev/null 2>&1; then
              NODE_ENV=production BASE_PATH=/YonBIP_EZine/ VITE_BASE_PATH=/YonBIP_EZine/ pm2 restart YonBIP_EZine --update-env
            else
              NODE_ENV=production BASE_PATH=/YonBIP_EZine/ VITE_BASE_PATH=/YonBIP_EZine/ pm2 start dist/server.cjs --name YonBIP_EZine
            fi
            pm2 save

  deploy-test:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build:test

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 123.56.7.111
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: mkdir -p /var/www/YonBIP_EZine-test

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 123.56.7.111
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/,package.json,package-lock.json"
          target: "/var/www/YonBIP_EZine-test"
          overwrite: true

      - name: Install production deps and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 123.56.7.111
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/YonBIP_EZine-test
            npm ci --omit=dev
            if [ ! -f .env ] && [ -f /var/www/YonBIP_EZine/.env ]; then
              cp /var/www/YonBIP_EZine/.env .env
            fi
            if pm2 describe YonBIP_EZine-test >/dev/null 2>&1; then
              PORT=3003 NODE_ENV=production BASE_PATH=/YonBIP_EZine-test/ VITE_BASE_PATH=/YonBIP_EZine-test/ pm2 restart YonBIP_EZine-test --update-env
            else
              PORT=3003 NODE_ENV=production BASE_PATH=/YonBIP_EZine-test/ VITE_BASE_PATH=/YonBIP_EZine-test/ pm2 start dist/server.cjs --name YonBIP_EZine-test
            fi
            pm2 save
