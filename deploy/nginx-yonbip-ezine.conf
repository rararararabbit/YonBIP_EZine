# YonBIP_EZine — 同机正式 / 测试反代片段
# 放入 /etc/nginx/conf.d/default.conf 的 server { } 内（与 Yonyou_red 并列）。
#
# 端口（与当前服务器一致）：
#   正式 YonBIP_EZine      → 3001
#   测试 YonBIP_EZine-test → 3003（3002 已被 Yonyou_red_test 占用）
#
# proxy_pass 末尾的 / 会剥掉 location 前缀，后端收到 / 与 /api/...

# 正式版：http://123.56.7.111/YonBIP_EZine/
location = /YonBIP_EZine {
    return 301 /YonBIP_EZine/;
}

location /YonBIP_EZine/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# 测试版：http://123.56.7.111/YonBIP_EZine-test/
location = /YonBIP_EZine-test {
    return 301 /YonBIP_EZine-test/;
}

location /YonBIP_EZine-test/ {
    proxy_pass http://127.0.0.1:3003/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# 不要再保留单独的 YonBIP_EZine「全局 /api」location。
# API 走：/YonBIP_EZine/api/... 与 /YonBIP_EZine-test/api/...
