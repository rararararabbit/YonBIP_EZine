# YonBIP_EZine — 同机正式 / 测试反代片段
# 用法：放入 server { ... } 内，或 include 本文件。
# 正式端口默认 3000；若 pm2 实际端口不同，改 proxy_pass。

# 正式版：http://123.56.7.111/YonBIP_EZine/
# proxy_pass 尾斜杠会剥掉 /YonBIP_EZine 前缀，后端收到 / 与 /api/...
location /YonBIP_EZine/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# 无尾斜杠时跳到带斜杠，避免静态资源相对路径错乱
location = /YonBIP_EZine {
    return 301 /YonBIP_EZine/;
}

# 测试版：http://123.56.7.111/YonBIP_EZine-test/
location /YonBIP_EZine-test/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

location = /YonBIP_EZine-test {
    return 301 /YonBIP_EZine-test/;
}

# 注意：不要再保留全局 location /api/ 指向某一套后端。
# 新前端 API 分别为：
#   /YonBIP_EZine/api/...
#   /YonBIP_EZine-test/api/...
